name: Doover App

on:
  workflow_call:
    inputs:
      app:
        description: >
          Directory to search for apps. Defaults to the repository root. A
          monorepo passes one app directory per caller file, alongside a `paths:`
          filter, so only the app that changed is rebuilt.
        type: string
        required: false
        default: "."
      staging:
        description: >
          Also publish and release to the staging control plane. The image itself
          is only ever pushed to the production registry (see NOTES.md), so this
          publishes with --no-build against a digest that already exists.
        type: boolean
        required: false
        default: false
      release:
        description: >
          Create an immutable version. This is what triggers server-side image
          signing, so turning it off leaves the pushed image unsigned.
        type: boolean
        required: false
        default: true
      runs-on:
        description: e.g. ubuntu-24.04-arm to build arm64 natively rather than under QEMU.
        type: string
        required: false
        default: ubuntu-latest
      lint-blocking:
        description: >
          Fail the build on lint or formatting failures. Off by default because the
          workflows this replaced ran ruff with continue-on-error, and a CI
          migration should not quietly start failing builds it previously passed.
          Turn on per repo as each one gets clean.
        type: boolean
        required: false
        default: false
      test-image:
        type: string
        required: false
        default: spaneng/doover_device_base
      python-version:
        type: string
        required: false
        default: "3.11"
      environment:
        description: GitHub environment to gate the release behind. Empty for none.
        type: string
        required: false
        default: ""

env:
  DOOVER_CONTROL_API_BASE_URL: https://api.doover.com
  DOOVER_OIDC_AUDIENCE: https://api.doover.com

jobs:
  # The matrix the old workflows hard-coded, now read from the repo. Handles both
  # layouts: several apps in one doover_config.json, and several self-contained
  # app directories.
  discover:
    runs-on: ${{ inputs.runs-on }}
    outputs:
      apps: ${{ steps.find.outputs.apps }}
      images: ${{ steps.find.outputs.images }}
      packages: ${{ steps.find.outputs.packages }}
      py_apps: ${{ steps.find.outputs.py_apps }}
      rs_apps: ${{ steps.find.outputs.rs_apps }}
    steps:
      - uses: actions/checkout@v4
      - uses: getdoover/setup-doover@main
        with:
          python-version: ${{ inputs.python-version }}
      - id: find
        shell: bash
        run: |
          apps="$(doover app discover '${{ inputs.app }}' --json)"
          echo "apps=$apps" >> "$GITHUB_OUTPUT"
          # Only apps that actually build an image reach the push/release jobs.
          # `builds_image` comes from the presence of a Dockerfile and cannot be
          # inferred from `type`: a DEV app may deploy a third-party image and
          # hold no source at all, and a PRO app ships a package.zip instead.
          echo "images=$(echo "$apps" | jq -c '[.[] | select(.builds_image)]')" >> "$GITHUB_OUTPUT"
          # The other deployable: processors, reports and integrations ship a
          # package.zip instead of an image. They are published here rather than
          # by hand so a processor release is reproducible from a commit like
          # every other release.
          echo "packages=$(echo "$apps" | jq -c '[.[] | select(.builds_package)]')" >> "$GITHUB_OUTPUT"
          # Tests are the one thing that cannot branch inside a job: pytest wants
          # the device-base container and cargo wants the runner, and `container:`
          # is set per job, not per matrix entry. So the test job is split by
          # language and each gets its own matrix. Everything else branches per
          # step on `matrix.app.language`.
          echo "py_apps=$(echo "$apps" | jq -c '[.[] | select(.language == "py")]')" >> "$GITHUB_OUTPUT"
          echo "rs_apps=$(echo "$apps" | jq -c '[.[] | select(.language == "rs")]')" >> "$GITHUB_OUTPUT"
          echo "$apps" | jq -r '.[] | "  \(.name)  dir=\(.dir)  lang=\(.language)  image=\(.builds_image)  package=\(.builds_package)"'

  check:
    needs: discover
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false # one broken app must not mask the others
      matrix:
        app: ${{ fromJson(needs.discover.outputs.apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: getdoover/setup-doover@main
        with:
          python-version: ${{ inputs.python-version }}

      # Rust is preinstalled on the GitHub runners, rustfmt and clippy included,
      # so there is no toolchain to set up — only the build artefacts to keep,
      # which is what makes the schema export below cheap the second time.
      - name: Cache cargo
        if: matrix.app.language == 'rs'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.app.dir }}/target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles(format('{0}/Cargo.lock', matrix.app.dir)) }}
          restore-keys: ${{ runner.os }}-cargo-check-

      # Advisory, matching what the workflows this replaced did (`run-linting.yml`
      # set `continue-on-error: true` on both ruff steps). Making lint blocking
      # across the fleet is a deliberate decision, not something a CI migration
      # should smuggle in — flip `lint-blocking` to true once the repos are clean.
      - name: Lint
        if: matrix.app.language != 'rs'
        continue-on-error: ${{ !inputs.lint-blocking }}
        run: doover app lint "${{ matrix.app.dir }}"

      # Checks by default; `--fix` is what makes it write. So no flag here.
      - name: Check formatting
        if: matrix.app.language != 'rs'
        continue-on-error: ${{ !inputs.lint-blocking }}
        run: doover app format "${{ matrix.app.dir }}"

      # The Rust equivalents. `-D warnings` because a clippy warning is the
      # closest thing Rust has to the ruff findings above, and the repos that
      # have one already run it that way.
      - name: Lint (cargo clippy)
        if: matrix.app.language == 'rs'
        continue-on-error: ${{ !inputs.lint-blocking }}
        working-directory: ${{ matrix.app.dir }}
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting (cargo fmt)
        if: matrix.app.language == 'rs'
        continue-on-error: ${{ !inputs.lint-blocking }}
        working-directory: ${{ matrix.app.dir }}
        run: cargo fmt --all -- --check

      # Schemas *are* blocking: a schema that does not match its source is a
      # deployment that misbehaves on a device, not a style preference.
      #
      # Language-agnostic by this point: the CLI runs the app's own exporter,
      # `uv run export-config` for a Python app and the binary's `export`
      # subcommand for a Rust one, and an app declaring `NO_EXPORT` because it
      # holds no config is skipped rather than failed.
      #
      # Every app's schemas are checked on each invocation; --app-name only
      # selects which is re-exported from source, so running per app is what
      # stops either app's committed schema drifting.
      - name: Validate schemas
        run: |
          doover config-schema validate "${{ matrix.app.dir }}" --app-name "${{ matrix.app.name }}"
          doover ui-schema validate "${{ matrix.app.dir }}" --app-name "${{ matrix.app.name }}"

  # Kept as its own job because the tests need a job-level `container:` — which
  # is also why this is per language rather than a branch inside one job:
  # `container:` cannot be set per matrix entry.
  test:
    needs: discover
    if: needs.discover.outputs.py_apps != '[]'
    runs-on: ${{ inputs.runs-on }}
    container:
      image: ${{ inputs.test-image }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.py_apps) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "**/uv.lock"
      - name: Install the project
        working-directory: ${{ matrix.app.dir }}
        run: uv sync --locked --all-extras --dev
      - name: Run tests
        working-directory: ${{ matrix.app.dir }}
        run: uv run pytest tests

  # The Rust half. On the runner rather than in the device-base container: the
  # toolchain is preinstalled there, and a Rust app's tests are unit tests
  # against its own crate, not against a device image.
  test_rust:
    needs: discover
    if: needs.discover.outputs.rs_apps != '[]'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.rs_apps) }}
    steps:
      - uses: actions/checkout@v4
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ${{ matrix.app.dir }}/target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles(format('{0}/Cargo.lock', matrix.app.dir)) }}
          restore-keys: ${{ runner.os }}-cargo-test-
      - name: Run tests
        working-directory: ${{ matrix.app.dir }}
        run: cargo test --locked

  # Importing the app package exercises the whole dependency graph — pydoover, the
  # app's own imports, native wheels — inside the built image, where a missing
  # system library actually shows up. Carried over verbatim in intent.
  smoke:
    needs: discover
    if: needs.discover.outputs.images != '[]'
    runs-on: ${{ inputs.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.dir }}
          load: true
          tags: smoke:latest
          cache-from: type=gha
      # A Rust app image is a static binary on scratch: nothing to import, and
      # no shell to import it with. Its equivalent is the binary's own `export`
      # subcommand, which exercises the same thing the import did — the binary
      # runs on the base at all, and its schema code is reachable — without
      # needing an agent. Skipped for an app that declares no config, since
      # there is then nothing for `export` to write.
      - name: Run the binary inside the image
        if: matrix.app.language == 'rs' && matrix.app.exports_config
        run: |
          docker run --rm smoke:latest export /tmp/doover_config.json \
            --app-name "${{ matrix.app.name }}"

      - name: Import the app inside the image
        if: matrix.app.language != 'rs'
        working-directory: ${{ matrix.app.dir }}
        run: |
          MODULES=$(python3 -c "import tomllib; s = tomllib.load(open('pyproject.toml','rb'))['project'].get('scripts', {}); print(' '.join(sorted({t.split(':')[0] for n, t in s.items() if n == 'doover-app-run' or n.startswith('doover-app-run-')})))")
          if [ -z "$MODULES" ]; then
            echo "No doover-app-run* entrypoint in pyproject.toml — nothing to import."
            exit 0
          fi
          for MODULE in $MODULES; do
            echo "Importing '$MODULE' inside the container..."
            docker run --rm --entrypoint python smoke:latest -c "import $MODULE; print('$MODULE import OK')"
          done

  # Push and release in one job per app, deliberately.
  #
  # The original split them so a release matrix could fan out over environments.
  # With a single registry there is nothing to fan out over, and merging them
  # fixes a real problem: a matrix job's `outputs` are not per-entry — whichever
  # leg finishes last overwrites the rest — so handing a digest from a matrix
  # `push` job to a matrix `release` job silently releases the wrong image in a
  # repo with more than one app. Keeping the digest inside one job removes that
  # class of bug entirely.
  publish:
    needs: [discover, check, test, test_rust, smoke]
    if: |
      always() && needs.discover.outputs.images != '[]'
      && needs.check.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.test_rust.result == 'success' || needs.test_rust.result == 'skipped')
      && (needs.smoke.result == 'success' || needs.smoke.result == 'skipped')
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false # one app failing must not block the others
      matrix:
        app: ${{ fromJson(needs.discover.outputs.images) }}
    steps:
      - uses: actions/checkout@v4
      - uses: getdoover/setup-doover@main
        with:
          python-version: ${{ inputs.python-version }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Publish before pushing: the registry credential is minted against this
      # application's publish permission and scoped to its repository, so the app
      # has to exist control-side before there is anything to mint against.
      - name: Register the app and log in to the registry
        run: |
          doover app publish "${{ matrix.app.dir }}" --app-name "${{ matrix.app.name }}" --no-release
          doover app registry-login --app-name "${{ matrix.app.name }}"

      - id: push
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.app.dir }}
          platforms: ${{ matrix.app.platforms || 'linux/arm64,linux/amd64' }}
          push: true
          tags: ${{ matrix.app.image_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Binds the version to the exact image just pushed. A pull request releases
      # as an alpha so it never auto-selects as Latest.
      - name: Release
        if: inputs.release
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: >-
          doover app release "${{ matrix.app.dir }}"
          --app-name "${{ matrix.app.name }}"
          --digest "${{ steps.push.outputs.digest }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --notes "$RELEASE_NOTES"
          ${{ github.event_name == 'pull_request' && '--alpha' || '' }}

      # The image only ever lives in the production registry, so staging gets the
      # app record and version against a digest that already exists — never a
      # second build, and never a push to a second registry.
      - name: Also release to staging
        if: inputs.release && inputs.staging
        env:
          DOOVER_CONTROL_API_BASE_URL: https://api.staging.udoover.com
          DOOVER_OIDC_AUDIENCE: https://api.staging.udoover.com
          RELEASE_NOTES: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: >-
          doover app publish "${{ matrix.app.dir }}" --app-name "${{ matrix.app.name }}"
          --no-build --no-release
          && doover app release "${{ matrix.app.dir }}"
          --app-name "${{ matrix.app.name }}"
          --digest "${{ steps.push.outputs.digest }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --notes "$RELEASE_NOTES"
          ${{ github.event_name == 'pull_request' && '--alpha' || '' }}

  # Processors, reports and integrations. Same shape as `publish`, but the
  # deployable is a package.zip built by the app's ./build.sh and uploaded to the
  # control plane, so there is no registry, no buildx and no digest to release
  # against — the uploaded source *is* the artefact.
  #
  # A separate job rather than a branch inside `publish`: that one needs qemu,
  # buildx and a registry login this never uses, and matrix entries cannot skip
  # steps cheaply. Both are gated on the same checks, so a repo holding an app of
  # each kind publishes both from one run. There is no `smoke` equivalent: a
  # package app has no image to import inside.
  publish-package:
    needs: [discover, check, test, test_rust]
    if: |
      always() && needs.discover.outputs.packages != '[]'
      && needs.check.result == 'success'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
      && (needs.test_rust.result == 'success' || needs.test_rust.result == 'skipped')
    runs-on: ${{ inputs.runs-on }}
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false # one app failing must not block the others
      matrix:
        app: ${{ fromJson(needs.discover.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: getdoover/setup-doover@main
        with:
          python-version: ${{ inputs.python-version }}

      # Builds package.zip (./build.sh) and uploads it. Split from the release
      # below for the same reason the image job splits them: publish registers
      # the app and its source, release is what creates the immutable version.
      - name: Publish the package
        run: >-
          doover app publish "${{ matrix.app.dir }}"
          --app-name "${{ matrix.app.name }}" --no-release

      - name: Release
        if: inputs.release
        env:
          RELEASE_NOTES: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: >-
          doover app release "${{ matrix.app.dir }}"
          --app-name "${{ matrix.app.name }}"
          --commit "${{ github.event.pull_request.head.sha || github.sha }}"
          --notes "$RELEASE_NOTES"
          ${{ github.event_name == 'pull_request' && '--alpha' || '' }}

      # Staging is a separate control plane, so unlike an image — which both
      # environments pull from the one registry — the package has to be uploaded
      # there as well. `--no-build-package` reuses the zip built above instead of
      # running ./build.sh again, so both environments get an identical upload.
      - name: Also publish and release to staging
        if: inputs.staging
        env:
          DOOVER_CONTROL_API_BASE_URL: https://api.staging.udoover.com
          DOOVER_OIDC_AUDIENCE: https://api.staging.udoover.com
          RELEASE_NOTES: ${{ github.event.head_commit.message || github.event.pull_request.title }}
        run: |
          doover app publish "${{ matrix.app.dir }}" \
            --app-name "${{ matrix.app.name }}" --no-build-package --no-release
          if [ "${{ inputs.release }}" = "true" ]; then
            doover app release "${{ matrix.app.dir }}" \
              --app-name "${{ matrix.app.name }}" \
              --commit "${{ github.event.pull_request.head.sha || github.sha }}" \
              --notes "$RELEASE_NOTES" \
              ${{ github.event_name == 'pull_request' && '--alpha' || '' }}
          fi
